---
- name: Deploy data stack
  hosts: data
  become: true
  vars:
    deploy_dir: /opt/uncooked
  roles:
    - docker
  tasks:
    - name: Create deploy directory
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy data compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../web/docker-compose.data.yml"
        dest: "{{ deploy_dir }}/docker-compose.data.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Start data services
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.data.yml up -d
        chdir: "{{ deploy_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Creating' in compose_up.stderr or compose_up.rc == 0"
